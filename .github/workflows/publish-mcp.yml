name: Publish to MCP Registry

# Publishes server.json to the Official MCP Registry using GitHub Actions OIDC.
# Running inside an aethon-credit repo grants the io.github.aethon-credit/* namespace
# automatically — no personal login or device-code flow (avoids registry issue #1649).
on:
  workflow_dispatch:
  push:
    tags: ["v*"] # tag a release (e.g. v0.1.0) to re-publish

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
